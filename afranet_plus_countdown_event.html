<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AFRANET PLUS | Countdown</title>

<!-- Vazirmatn: crisp, modern Persian numerals and labels -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root { --cyan:#36e5ff; --blue:#168cff; --muted:#8ba5b8; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    color:#f4fbff; font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
    background:
      radial-gradient(ellipse at 50% 38%, rgba(0,145,255,.17), transparent 48%),
      linear-gradient(145deg,#05090f 0%,#0a1420 55%,#03070c 100%);
    overflow:hidden;
  }
  body:before {
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.19;
    background-image:linear-gradient(rgba(54,229,255,.13) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(54,229,255,.13) 1px,transparent 1px);
    background-size:42px 42px;
    mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 80%,transparent);
  }
  .frame {
    position:relative; width:min(900px,100%); padding:clamp(26px,5vw,58px);
    border:1px solid rgba(54,229,255,.35); border-radius:28px;
    background:linear-gradient(150deg,rgba(15,29,43,.94),rgba(5,12,20,.96));
    box-shadow:0 0 55px rgba(0,153,255,.13), inset 0 0 35px rgba(54,229,255,.035);
    text-align:center;
  }
  .frame:before,.frame:after { content:""; position:absolute; width:52px;height:3px;background:var(--cyan);box-shadow:0 0 14px var(--cyan); }
  .frame:before { top:-1px;right:42px; } .frame:after { bottom:-1px;left:42px; }
  .eyebrow { color:var(--cyan); font-size:12px; letter-spacing:4px; direction:ltr; font-weight:700; font-family:Arial,sans-serif; }
  h1 { direction:ltr; margin:15px 0 7px; font-size:clamp(30px,6vw,54px); letter-spacing:2px; font-weight:800; font-family:Arial,sans-serif; text-shadow:0 0 24px rgba(54,229,255,.22); }
  .subtitle { color:#b5c9d8; font-size:clamp(14px,2.4vw,19px); margin:0; font-weight:500; }
  .event-note { color:#8faec0; font-size:clamp(12px,2vw,15px); line-height:1.9; max-width:620px; margin:10px auto 0; font-weight:400; }
  .tagline { color:var(--cyan); font-size:clamp(12px,1.8vw,14px); font-weight:600; margin:-22px 0 30px; letter-spacing:.3px; }
  .date { display:inline-block; margin:23px 0 34px; padding:9px 19px; border:1px solid rgba(54,229,255,.25); border-radius:30px; color:var(--cyan); background:rgba(54,229,255,.055); font-size:14px; font-weight:600; }
  .timer { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:clamp(8px,2vw,18px); direction:ltr; }
  .unit { padding:clamp(13px,3vw,24px) 6px; border:1px solid rgba(54,229,255,.2); border-radius:17px; background:linear-gradient(180deg,rgba(20,47,66,.8),rgba(8,19,30,.8)); }
  .number {
    display:block; color:#eafaff; font-family:"Vazirmatn",Tahoma,sans-serif;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
    font-size:clamp(34px,7.2vw,68px); line-height:1.2; font-weight:800;
    letter-spacing:0; text-shadow:0 0 18px rgba(54,229,255,.45);
    direction:ltr; unicode-bidi:isolate;
  }
  .label { display:block; margin-top:10px; color:var(--muted); font-size:clamp(12px,1.8vw,15px); direction:rtl; font-weight:500; }
  .footer { margin-top:34px; color:#8ca8bb; font-size:12px; letter-spacing:.5px; font-family:Arial,"Vazirmatn",sans-serif; }
  .pulse { display:inline-block; width:7px;height:7px;border-radius:50%;background:#45f4bd;margin-left:8px;box-shadow:0 0 12px #45f4bd;animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.35; transform:scale(.75); } }
  @media(max-width:520px) { body{padding:12px}.frame{padding:28px 15px;border-radius:20px}.timer{gap:6px}.unit{border-radius:12px}.date{margin:18px 0 24px} }
</style>
</head>
<body>
<main class="frame">
  <div class="eyebrow">COUNTDOWN TO THE NEXT CHAPTER</div>
  <h1>AFRANET PLUS</h1>
  <p class="subtitle">شمارش معکوس تا یک آغاز تازه</p>
  <p class="event-note">رونمایی از نام جدید و آغاز فصلی متفاوت در دنیای خدمات فناوری اطلاعات</p>
  <div class="date">۲ دی ۱۴۰۵ <span dir="ltr">| 23 DEC 2026</span></div>
  <div class="tagline">یک نام، یک مسیر، یک آینده</div>
  <section class="timer" aria-label="زمان باقی‌مانده">
    <div class="unit"><span class="number" id="days">۰۰</span><span class="label">روز</span></div>
    <div class="unit"><span class="number" id="hours">۰۰</span><span class="label">ساعت</span></div>
    <div class="unit"><span class="number" id="minutes">۰۰</span><span class="label">دقیقه</span></div>
    <div class="unit"><span class="number" id="seconds">۰۰</span><span class="label">ثانیه</span></div>
  </section>
  <div class="footer"><span class="pulse"></span>LIVE COUNTDOWN&nbsp; · &nbsp;IRAN STANDARD TIME</div>
</main>
<script>
(() => {
  // 2 Dey 1405 = 23 December 2026, 00:00 in Tehran (UTC+03:30).
  const target = Date.UTC(2026, 11, 22, 20, 30, 0);
  const fa = n => String(n).padStart(2, '0').replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const update = () => {
    let remaining = Math.max(0, target - Date.now());
    const days = Math.floor(remaining / 86400000); remaining %= 86400000;
    const hours = Math.floor(remaining / 3600000); remaining %= 3600000;
    const minutes = Math.floor(remaining / 60000); remaining %= 60000;
    const seconds = Math.floor(remaining / 1000);
    document.getElementById('days').textContent = fa(days);
    document.getElementById('hours').textContent = fa(hours);
    document.getElementById('minutes').textContent = fa(minutes);
    document.getElementById('seconds').textContent = fa(seconds);
    if (Date.now() >= target) {
      document.querySelector('.subtitle').textContent = 'امروز، نامی تازه و فصلی متفاوت رونمایی می‌شود';
      document.querySelector('.footer').textContent = 'THE DAY HAS ARRIVED';
    }
  };
  update(); setInterval(update, 1000);
})();
</script>
</body>
</html>
